name: Android CI
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug and release APKs
        run: gradle build assembleDebug assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tavalodyad-apks
          path: app/build/outputs/apk/**/*.apk
